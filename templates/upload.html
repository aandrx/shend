<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shend Upload</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: #fff; }
        h1 { color: #5865F2; }
        .dropzone { border: 3px dashed #5865F2; border-radius: 10px; padding: 40px; text-align: center; cursor: pointer; }
        .dropzone:hover { background: #2a2a2a; }
        input[type="file"] { display: none; }
        button { background: #5865F2; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 10px; padding: 15px; border-radius: 5px; display: none; }
        .success { background: #2d7d46; }
        .error { background: #8b2e2e; }
        #log { margin-top: 20px; padding: 10px; background: #2a2a2a; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
        #log div { margin: 2px 0; }
        .progress-container { margin-top: 20px; display: none; }
        .progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #5865F2; width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; margin-top: 5px; font-size: 14px; }
        .step { color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Shend Video Upload</h1>
    <p>Drop your video here or click to browse. Max 500MB.</p>
    
    <form id="uploadForm" action="/upload?token={{ token }}" method="post" enctype="multipart/form-data">
        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
            <p>Click or drag video here</p>
            <input type="file" id="fileInput" name="video" accept="video/*" required>
        </div>
        <button type="submit" id="submitBtn">Upload and Compress</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
        <div class="step" id="stepText">Waiting...</div>
    </div>

    <div id="log"></div>
    <div id="status"></div>

    <script>
        const dropzone = document.querySelector('.dropzone');
        const fileInput = document.getElementById('fileInput');
        const form = document.getElementById('uploadForm');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const stepText = document.getElementById('stepText');

        function log(msg) {
            const line = document.createElement('div');
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setProgress(percent, step) {
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
            stepText.textContent = step;
        }

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#2a2a2a'; });
        dropzone.addEventListener('dragleave', () => { dropzone.style.background = ''; });
        dropzone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            fileInput.files = e.dataTransfer.files; 
            dropzone.querySelector('p').textContent = e.dataTransfer.files[0].name; 
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                const f = fileInput.files[0];
                dropzone.querySelector('p').textContent = f.name;
                log('Selected: ' + f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + 'MB)');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) {
                log('No file selected');
                return;
            }

            log('Starting upload...');
            btn.disabled = true;
            btn.textContent = 'Uploading...';
            status.style.display = 'none';
            progressContainer.style.display = 'block';
            setProgress(5, 'Uploading to server...');

            const formData = new FormData(form);
            const startTime = Date.now();
            
            // Estimate total time: upload + compression + response
            // Rough heuristic: 1MB upload ~1s, compression ~1s per 10MB
            const estimatedUploadSec = Math.max(file.size / 1024 / 1024, 1);
            const estimatedCompressSec = Math.max(file.size / 1024 / 1024 / 10, 5);
            const estimatedTotalSec = estimatedUploadSec + estimatedCompressSec + 2;
            log('Estimated time: ~' + Math.round(estimatedTotalSec) + ' seconds');

            try {
                log('Sending to server (' + Math.round(estimatedUploadSec) + 's estimated)...');
                setProgress(10, 'Uploading to server...');

                const res = await fetch(form.action, { method: 'POST', body: formData });
                const elapsed = (Date.now() - startTime) / 1000;
                log('Server responded in ' + elapsed.toFixed(1) + 's: ' + res.status);
                setProgress(50, 'Compressing video...');

                const data = await res.json();
                
                if (res.ok) {
                    setProgress(100, 'Complete!');
                    status.className = 'success';
                    status.textContent = 'Upload complete! Check Discord for the result.';
                    log('Success! URL: ' + data.url);
                    log('Total time: ' + elapsed.toFixed(1) + 's');
                } else {
                    setProgress(0, 'Failed');
                    status.className = 'error';
                    status.textContent = 'Error: ' + (data.detail || 'Unknown error');
                    log('Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (err) {
                setProgress(0, 'Failed');
                status.className = 'error';
                status.textContent = 'Network error: ' + err.message;
                log('Network error: ' + err.message);
            }
            
            status.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Upload and Compress';
        });
    </script>
</body>
</html>
